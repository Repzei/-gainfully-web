<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}" />
  <link rel="canonical" href="https://gainfully.app/{{SLUG}}" />
  <link rel="alternate" hreflang="da" href="https://gainfully.app/{{SLUG_DA}}" />
  <link rel="alternate" hreflang="en" href="https://gainfully.app/{{SLUG_EN}}" />
  <link rel="alternate" hreflang="de" href="https://gainfully.app/{{SLUG_DE}}" />
  <link rel="alternate" hreflang="fr" href="https://gainfully.app/{{SLUG_FR}}" />
  <link rel="alternate" hreflang="es" href="https://gainfully.app/{{SLUG_ES}}" />
  <link rel="alternate" hreflang="pt-BR" href="https://gainfully.app/{{SLUG_PT}}" />
  <link rel="alternate" hreflang="x-default" href="https://gainfully.app/{{SLUG_EN}}" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <meta property="og:type" content="article" />
  <meta property="og:url" content="https://gainfully.app/{{SLUG}}" />
  <meta property="og:title" content="{{OG_TITLE}}" />
  <meta property="og:description" content="{{OG_DESCRIPTION}}" />
  <meta property="og:image" content="https://gainfully.app/og-image.jpg" />
  <meta property="og:site_name" content="Gainfully" />
  <meta name="author" content="Gainfully" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "{{TITLE}}",
    "description": "{{OG_DESCRIPTION}}",
    "url": "https://gainfully.app/{{SLUG}}",
    "datePublished": "{{DATE}}",
    "dateModified": "{{DATE}}",
    "inLanguage": "{{LANG}}",
    "author": { "@type": "Organization", "name": "Gainfully", "url": "https://gainfully.app" },
    "publisher": {
      "@type": "Organization",
      "name": "Gainfully",
      "url": "https://gainfully.app",
      "logo": { "@type": "ImageObject", "url": "https://gainfully.app/icon.png" }
    },
    "mainEntityOfPage": { "@type": "WebPage", "@id": "https://gainfully.app/{{SLUG}}" }
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {{FAQ_JSON_ITEMS}}
    ]
  }
  </script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-body);
      font-size: 17px; line-height: 1.75;
    }
    a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
    h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; }

    nav {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding: 18px 40px; border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 96%, transparent); backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }
    nav a { text-decoration: none; }
    .nav-logo {
      font-family: var(--font-display); font-size: 18px; font-weight: 800; color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    .nav-back { font-size: 14px; color: var(--text-muted); }
    .nav-cta {
      background: var(--action); color: var(--on-action);
      font-weight: 700; font-size: 14px; padding: 8px 18px; border-radius: 10px;
    }

    .article-wrap { max-width: 740px; margin: 0 auto; padding: 64px 24px 120px; }
    .article-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(28px, 5vw, 44px); font-weight: 800;
      letter-spacing: -1.5px; line-height: 1.07; margin-bottom: 20px;
    }
    .article-meta {
      font-size: 13px; color: var(--text-muted); display: flex; gap: 16px;
      flex-wrap: wrap; margin-bottom: 48px; padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    h2 {
      font-size: clamp(20px, 3vw, 28px); font-weight: 800;
      letter-spacing: -0.8px; margin-top: 56px; margin-bottom: 14px;
    }
    h3 { font-size: 19px; font-weight: 700; letter-spacing: -0.4px; margin-top: 36px; margin-bottom: 10px; }
    p { color: var(--text-muted); margin-bottom: 18px; max-width: 65ch; }
    p strong, li strong { color: var(--text); font-weight: 600; }
    ul, ol { color: var(--text-muted); padding-left: 20px; margin-bottom: 18px; max-width: 65ch; }
    li { margin-bottom: 8px; }

    .callout {
      background: var(--surface); border: 1px solid var(--border);
      border-left: 3px solid var(--input-border);
      border-radius: 12px; padding: 20px 24px; margin: 28px 0;
    }
    .callout-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text); margin-bottom: 8px;
    }
    .callout p { margin-bottom: 0; }

    .table-wrap { overflow-x: auto; margin: 28px 0; }
    table {
      width: 100%; border-collapse: collapse; font-size: 14px;
      background: var(--surface); border-radius: 12px; overflow: hidden;
      font-variant-numeric: tabular-nums;
    }
    th {
      background: var(--surface-2); color: var(--text);
      font-weight: 700; font-size: 11px; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 12px 16px; text-align: left;
    }
    td { padding: 12px 16px; color: var(--text-muted); border-top: 1px solid var(--border); }
    td:first-child { color: var(--text); font-weight: 600; }

    .faq h3 { margin-top: 28px; }

    .app-promo {
      border: 1px solid var(--border); border-radius: 20px;
      padding: 36px 40px; margin: 56px 0; text-align: center;
    }
    .app-promo h3 { margin-top: 0; margin-bottom: 12px; font-size: 22px; }
    .app-promo p { margin: 0 auto 24px; max-width: 50ch; }
    .promo-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .promo-btns a { text-decoration: none; font-weight: 700; padding: 12px 24px; border-radius: 12px; font-size: 15px; }
    .promo-btn-primary { background: var(--action); color: var(--on-action); }
    .promo-btn-secondary { color: var(--text); border: 1px solid var(--input-border); }

    .related { margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--border); font-size: 14px; color: var(--text-muted); }
    .related a { color: var(--text-muted); margin: 0 8px; }

    footer {
      border-top: 1px solid var(--border); padding: 32px 40px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--text-muted);
    }
    footer a { color: var(--text-muted); }

    @media (max-width: 600px) {
      nav { padding: 16px 20px; }
      .nav-back { display: none; }
      .article-wrap { padding: 40px 20px 80px; }
      .app-promo { padding: 28px 24px; }
      footer { padding: 24px 20px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="{{HOME_URL}}" class="nav-logo">
      <svg viewBox="15 15 70 70" fill="none" role="img" aria-label="Gainfully" width="28" height="28"><path d="M71.2 28.8 A30 30 0 1 0 79.2 57 L64 57" style="stroke:var(--text)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M40.5 45 L50 36 L59.5 45" style="stroke:var(--progress)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Gainfully
    </a>
    <a href="{{HOME_URL}}" class="nav-back">{{BACK_TO_HOME}}</a>
    <a href="https://apps.apple.com/app/gainfully/id6775987256" class="nav-cta">{{CTA_SHORT}}</a>
  </nav>

  <main>
    <article class="article-wrap">

      <div class="article-label">{{LABEL}}</div>
      <h1>{{H1}}</h1>
      <div class="article-meta">
        <span>Gainfully · {{DATE_HUMAN}}</span>
        <span>{{READ_TIME}}</span>
      </div>

      {{BODY}}

      <div class="app-promo">
        <h3>{{PROMO_TITLE}}</h3>
        <p>{{PROMO_TEXT}}</p>
        <div class="promo-btns">
          <a href="https://apps.apple.com/app/gainfully/id6775987256" class="promo-btn-primary">{{CTA_IOS}}</a>
          <a href="https://play.google.com/store/apps/details?id=com.gainfully.app" class="promo-btn-secondary">{{CTA_ANDROID}}</a>
        </div>
      </div>

      <section class="faq">
        <h2>{{FAQ_HEADING}}</h2>
        {{FAQ_HTML}}
      </section>

      <div class="related">
        {{RELATED_LABEL}}:
        {{RELATED_LINKS}}
      </div>

    </article>
  </main>

  <footer>
    <span>© 2026 Gainfully</span>
    <div style="display:flex;gap:20px;">
      <a href="privacy.html">{{PRIVACY}}</a>
      <a href="terms.html">{{TERMS}}</a>
      <a href="mailto:support@gainfully.app">{{CONTACT}}</a>
    </div>
  </footer>

</body>
</html>
