name: SEO Audit

on:
  schedule:
    - cron: '0 7 * * 1'  # Hver mandag kl. 07:00 UTC
  push:
    branches: [main]
  workflow_dispatch:      # Manuel kørsel fra GitHub UI

permissions:
  contents: write

jobs:
  audit:
    name: SEO Audit + Sitemap Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kør SEO audit
        run: node scripts/seo-agent.mjs

      - name: Commit sitemap-opdateringer
        run: |
          git config user.name "SEO Agent"
          git config user.email "noreply@gainfully.app"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "chore: opdater sitemap lastmod datoer [skip ci]"
          git push
